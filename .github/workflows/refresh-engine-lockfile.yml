name: refresh-engine-lockfile

on:
  push:
    branches:
      - agent/security-dependency-remediation
    paths:
      - package.json
      - .github/workflows/refresh-engine-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm
      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile metadata
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: align Node engine lockfile metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
