name: dev-audit-fix-probe

on:
  push:
    branches:
      - agent/security-dependency-remediation

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate non-breaking audit lock refresh
        shell: bash
        run: |
          cp package-lock.json package-lock.before.json
          npm audit fix --package-lock-only || true
      - name: Verify changed lock entries are dev-only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const b = before.packages || {};
          const a = after.packages || {};
          const keys = new Set([...Object.keys(b), ...Object.keys(a)]);
          const changed = [];
          const nonDev = [];
          for (const key of [...keys].sort()) {
            if (JSON.stringify(b[key]) === JSON.stringify(a[key])) continue;
            const entry = a[key];
            changed.push({ key, beforeVersion: b[key]?.version || null, afterVersion: entry?.version || null, dev: entry?.dev === true });
            if (key !== '' && entry && entry.dev !== true) nonDev.push({ key, version: entry.version || null, dev: entry.dev });
          }
          console.log('CHANGED_PACKAGE_ENTRIES=' + JSON.stringify(changed, null, 2));
          if (nonDev.length) {
            console.error('NON_DEV_CHANGED=' + JSON.stringify(nonDev, null, 2));
            process.exit(1);
          }
          console.log(`Verified ${changed.length} changed lock package entries; all non-root changed entries are dev:true.`);
          NODE
      - name: Verify refreshed lock installs cleanly
        shell: bash
        run: |
          rm -rf node_modules
          npm ci
      - name: Verify post-refresh audits
        shell: bash
        run: |
          echo '=== FULL AUDIT ==='
          npm audit --json || true
          echo '=== PRODUCTION AUDIT ==='
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: dev-audit-fixed-lock
          path: package-lock.json
          if-no-files-found: error
