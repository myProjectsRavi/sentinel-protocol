name: refresh-security-lockfile

on:
  push:
    branches:
      - agent/security-dependency-remediation
    paths:
      - package.json
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve security-patched lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Report resolved security versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const names = ['express', 'body-parser', 'qs', 'uuid', 'protobufjs', 'sharp'];
          for (const name of names) {
            const versions = [...new Set(
              Object.entries(lock.packages)
                .filter(([path]) => path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`))
                .map(([, meta]) => meta.version)
                .filter(Boolean)
            )].sort();
            console.log(`${name}=${versions.join(',') || 'missing'}`);
          }
          NODE
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh security lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
