name: branch-release-metadata-sync

on:
  push:
    branches:
      - 'agent/npm-latest-bootstrap-sync'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npm-latest-bootstrap-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize README and lockfile release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('SENTINEL PROTOCOL v1.2.7', 'SENTINEL PROTOCOL v1.2.8')
          text = text.replace('--package sentinel-protocol ', '--package sentinel-protocol@latest ')

          needle = '**That\'s it.** Sentinel is now running with:'
          notice = (
              '**That\'s it.**\n\n'
              '> **Same command for installs and updates:** `@latest` resolves the newest published Sentinel release. '
              'On first bootstrap Sentinel creates the selected profile; on repeat bootstrap it validates/migrates and preserves '
              'your existing configuration and runtime settings. Use `--force` only when you intentionally want to reset the config.\n\n'
              'Sentinel is now running with:'
          )
          if needle in text and 'Same command for installs and updates' not in text:
              text = text.replace(needle, notice, 1)

          path.write_text(text, encoding='utf-8')
          PY

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm .github/workflows/branch-release-metadata-sync.yml
          git diff --check

      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md package-lock.json .github/workflows/branch-release-metadata-sync.yml
          if git diff --cached --quiet; then
            echo 'No metadata changes needed.'
            exit 0
          fi
          git commit -m 'docs: sync npm latest bootstrap metadata'
          git push origin HEAD:agent/npm-latest-bootstrap-sync
