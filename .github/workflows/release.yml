name: release-sync

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: sentinel-release-sync
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: sentinel-protocol

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Resolve release state
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          RELEASE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          VERSION="$(node -p "require('./package.json').version")"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be stable MAJOR.MINOR.PATCH, got ${VERSION}" >&2
            exit 1
          fi

          if [[ "${RELEASE_SHA}" != "${MAIN_SHA}" ]]; then
            echo "Skipping stale successful CI commit ${RELEASE_SHA}; current main is ${MAIN_SHA}."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          published="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)"
          latest="$(npm view "${PACKAGE_NAME}@latest" version 2>/dev/null || true)"

          if [[ "${published}" == "${VERSION}" ]]; then
            if [[ "${latest}" != "${VERSION}" ]]; then
              echo "${PACKAGE_NAME}@${VERSION} already exists, but latest points to ${latest:-missing}; refusing to guess at dist-tag repair." >&2
              exit 1
            fi
            echo "${PACKAGE_NAME}@${VERSION} is already published and latest. Nothing to synchronize."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release=true" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "${GITHUB_ENV}"

      - name: Require green CI and security scan on the exact release commit
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local workflow_file="$1"
            local label="$2"
            local row=""

            for attempt in {1..36}; do
              row="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&event=push&per_page=50" |
                  jq -r --arg sha "${RELEASE_SHA}" '
                    [.workflow_runs[] | select(.head_sha == $sha)]
                    | sort_by(.created_at)
                    | reverse
                    | if length == 0 then empty else .[0] | [.status, (.conclusion // ""), .html_url] | @tsv end
                  '
              )"

              if [[ -n "${row}" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "${row}"
                if [[ "${status}" == "completed" ]]; then
                  if [[ "${conclusion}" == "success" ]]; then
                    echo "${label}: success (${url})"
                    return 0
                  fi
                  echo "${label}: ${conclusion:-unknown} (${url})" >&2
                  return 1
                fi
                echo "${label}: ${status}; waiting for exact SHA ${RELEASE_SHA} (attempt ${attempt}/36)"
              else
                echo "${label}: run for exact SHA ${RELEASE_SHA} not visible yet (attempt ${attempt}/36)"
              fi
              sleep 10
            done

            echo "Timed out waiting for ${label} on ${RELEASE_SHA}" >&2
            return 1
          }

          require_success "ci.yml" "CI"
          require_success "security-scan.yml" "security scan"

      - name: Install release dependencies
        if: steps.release.outputs.release == 'true'
        run: npm ci

      - name: Validate release candidate
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:transformers:compat
          npm run lint
          npm run openapi:validate
          npm run test:unit:ci
          npm run test:integration
          npm run reliability -- --duration 4 --connections 20 --chaos-requests 16 --timeout-requests 10 --websocket-requests 8
          npm audit --omit=dev --audit-level=high
          npm run ci:cli:lifecycle
          npm run test:coverage:gate
          npm run perf:p0:gate
          npm run perf:p1:gate
          npm run perf:p2:gate
          npm run perf:p3:gate
          npm run perf:v4:phasea:gate
          npm run benchmark -- --duration 3 --connections 16 --pipelining 1
          npm run benchmark:gate
          node ./cli/sentinel.js aibom export --format json --out aibom.json
          npm run sbom:cyclonedx > sbom.cyclonedx.json
          npm run sbom:spdx > sbom.spdx.json
          npm run ci:vscode:package

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.release == 'true'
        with:
          name: sbom-release-${{ steps.release.outputs.version }}
          path: |
            aibom.json
            sbom.cyclonedx.json
            sbom.spdx.json
            dist/*.vsix

      - name: Create or verify GitHub tag and release
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          tag_lines="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" || true)"
          tag_sha=""
          if [[ -n "${tag_lines}" ]]; then
            tag_sha="$(printf '%s\n' "${tag_lines}" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
            if [[ -z "${tag_sha}" ]]; then
              tag_sha="$(printf '%s\n' "${tag_lines}" | awk 'NR == 1 {print $1}')"
            fi
            if [[ "${tag_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Existing tag ${TAG} points to ${tag_sha}, expected ${RELEASE_SHA}; refusing to move an immutable release tag." >&2
              exit 1
            fi
          fi

          notes="${RUNNER_TEMP}/sentinel-release-notes.md"
          cat > "${notes}" <<EOF
          ## Sentinel Protocol ${VERSION}

          This release was created automatically from the exact green `main` commit `${RELEASE_SHA}`.

          ### Install or update

          \`\`\`bash
          npx --yes --package sentinel-protocol@latest sentinel bootstrap --profile minimal --dashboard
          \`\`\`

          First bootstrap initializes the requested profile. Repeat bootstrap updates to the newest published Sentinel executable while preserving validated/migrated local configuration and runtime settings.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists on the verified tag."
          elif [[ -n "${tag_sha}" ]]; then
            gh release create "${TAG}" --verify-tag --title "Sentinel Protocol ${TAG}" --notes-file "${notes}"
          else
            gh release create "${TAG}" --target "${RELEASE_SHA}" --title "Sentinel Protocol ${TAG}" --notes-file "${notes}"
          fi

      - name: Publish npm package
        if: steps.release.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN repository secret is required for Sentinel npm publishing." >&2
            exit 1
          fi
          npm publish --provenance --access public

      - name: Verify GitHub and npm are synchronized
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          published=""
          latest=""

          gh release view "${TAG}" --json tagName,isDraft,isPrerelease,targetCommitish >/dev/null

          for attempt in {1..18}; do
            published="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)"
            latest="$(npm view "${PACKAGE_NAME}@latest" version 2>/dev/null || true)"
            if [[ "${published}" == "${VERSION}" && "${latest}" == "${VERSION}" ]]; then
              echo "Verified GitHub ${TAG}, ${PACKAGE_NAME}@${VERSION}, and latest -> ${VERSION}."
              exit 0
            fi
            echo "Registry not converged yet (attempt ${attempt}/18): published=${published:-missing}, latest=${latest:-missing}"
            sleep 5
          done

          echo "Release synchronization failed: published=${published:-missing}, latest=${latest:-missing}, expected=${VERSION}" >&2
          exit 1

      - name: Publish VS Code extension (optional)
        if: steps.release.outputs.release == 'true' && env.VSCE_PAT != ''
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@2.29.0 publish --packagePath "$(ls dist/*.vsix | head -n 1)" --pat "${VSCE_PAT}"
